{% assign sc_project_id = site.analytics.statcounter.project_id | default: "" | strip %}
{% assign sc_security_code = site.analytics.statcounter.security_code | default: "" | strip %}
{% if jekyll.environment == "production" and sc_project_id != "" and sc_security_code != "" %}
<script>
  var sc_project = {{ sc_project_id | plus: 0 | jsonify }};
  var sc_invisible = 1;
  var sc_security = {{ sc_security_code | jsonify }};
</script>
<script async src="https://www.statcounter.com/counter/counter.js"></script>
<noscript><img src="https://c.statcounter.com/{{ sc_project_id | escape }}/0/{{ sc_security_code | escape }}/1/" alt="" width="1" height="1" referrerpolicy="no-referrer-when-downgrade"></noscript>
{% endif %}
